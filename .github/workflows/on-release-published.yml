name: On Release Published

on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag (e.g., v1.0.0)"
        type: string
        required: true
      elixir-version:
        description: "Elixir version to publish with"
        type: string
        required: false
        default: "1.18"
      otp-version:
        description: "OTP version to publish with"
        type: string
        required: false
        default: "27"
    secrets:
      hex-api-key:
        description: "Hex.pm API key"
        required: true

permissions:
  contents: read

jobs:
  hex-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}

      - uses: georgeguimaraes/workflows/actions/elixir-setup@main
        with:
          elixir-version: ${{ inputs.elixir-version }}
          otp-version: ${{ inputs.otp-version }}

      - uses: georgeguimaraes/workflows/actions/hex-publish@main
        with:
          hex-api-key: ${{ secrets.hex-api-key }}
